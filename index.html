<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Player Info</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d0f17; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #161926; border: 1px solid #262a3d; border-radius: 14px; padding: 24px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    h2 { text-align: center; margin-bottom: 20px; color: #ff9900; font-size: 22px; letter-spacing: 0.5px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #2e344d; background: #0a0c12; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #ff9900; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #ff9900; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e68a00; }
    .profile-box { display: none; margin-top: 16px; background: #0f121d; border-radius: 10px; padding: 18px; border: 1px solid #222638; }
    .header-info { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2438; padding-bottom: 12px; margin-bottom: 12px; }
    .name-title { font-size: 18px; font-weight: bold; color: #fff; }
    .badge { background: #ff9900; color: #000; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1a1e2f; font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .label { color: #7f88a6; }
    .val { font-weight: 600; color: #f1f2f6; }
    .status { text-align: center; font-size: 13px; margin-top: 10px; color: #ff4757; }
  </style>
</head>
<body>

  <div class="card">
    <h2>FF Player Lookup</h2>
    <div class="search-box">
      <input type="text" id="uidInput" placeholder="Enter Player UID..." value="3070705020">
      <button onclick="fetchProfile()">Search</button>
    </div>

    <div id="status" class="status"></div>

    <div id="profile" class="profile-box">
      <div class="header-info">
        <span id="name" class="name-title">-</span>
        <span id="levelBadge" class="badge">Lv. -</span>
      </div>
      <div class="row"><span class="label">UID:</span><span id="uid" class="val">-</span></div>
      <div class="row"><span class="label">Likes:</span><span id="likes" class="val">-</span></div>
      <div class="row"><span class="label">Region:</span><span id="region" class="val">-</span></div>
      <div class="row"><span class="label">BR Rank Point:</span><span id="brRank" class="val">-</span></div>
      <div class="row"><span class="label">CS Rank Point:</span><span id="csRank" class="val">-</span></div>
      <div class="row"><span class="label">Signature/Bio:</span><span id="bio" class="val">-</span></div>
    </div>
  </div>

  <script>
    async function fetchProfile() {
      const uid = document.getElementById('uidInput').value.trim();
      const status = document.getElementById('status');
      const profile = document.getElementById('profile');

      if (!uid) {
        status.innerText = "कृपया UID दर्ज करें!";
        profile.style.display = "none";
        return;
      }

      status.style.color = "#ff9900";
      status.innerText = "डेटा लोड हो रहा है...";
      profile.style.display = "none";

      const endpoints = [
        `https://freefireapi.com.br/api/search_id?id=${uid}`,
        `https://ff-api.vercel.app/api/player?uid=${uid}`,
        `https://ff.garena.now.sh/api/player?id=${uid}`
      ];

      let fetchedData = null;

      for (let url of endpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            fetchedData = await res.json();
            break;
          }
        } catch (e) {
          continue;
        }
      }

      if (!fetchedData) {
        status.style.color = "#ff4757";
        status.innerText = "प्लेयर नहीं मिला या सर्वर ऑफलाइन है।";
        return;
      }

      const acc = fetchedData.AccountInfo || fetchedData.basicInfo || fetchedData;

      document.getElementById('name').innerText = acc.nickname || acc.AccountName || "N/A";
      document.getElementById('levelBadge').innerText = "Lv. " + (acc.level || acc.AccountLevel || "-");
      document.getElementById('uid').innerText = acc.accountId || acc.AccountId || uid;
      document.getElementById('likes').innerText = acc.likes || acc.AccountLikes || "0";
      document.getElementById('region').innerText = acc.region || acc.AccountRegion || "IND";
      document.getElementById('brRank').innerText = acc.rankingPoints || acc.brPoints || "N/A";
      document.getElementById('csRank').innerText = acc.csRankingPoints || acc.csPoints || "N/A";
      document.getElementById('bio').innerText = acc.signature || acc.AccountSignature || "None";

      status.innerText = "";
      profile.style.display = "block";
    }
  </script>
</body>
</html>
