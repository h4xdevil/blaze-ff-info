<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Player Info</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f111a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1a1d2e; border: 1px solid #2a2e45; border-radius: 12px; padding: 24px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #ff9900; font-size: 22px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333954; background: #0b0d14; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #ff9900; }
    button { padding: 12px 18px; border-radius: 6px; border: none; background: #ff9900; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #e68a00; }
    .profile-box { display: none; margin-top: 15px; background: #131622; border-radius: 8px; padding: 16px; border: 1px solid #23273c; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e2235; font-size: 14px; }
    .row:last-child { border-bottom: none; }
    .label { color: #8c93b0; }
    .val { font-weight: 600; color: #fff; }
    .status { text-align: center; font-size: 14px; margin-top: 10px; color: #ff4757; }
  </style>
</head>
<body>

  <div class="card">
    <h2>FF Player Lookup</h2>
    <div class="search-box">
      <input type="text" id="uidInput" placeholder="Enter Player UID..." value="3070705020">
      <button onclick="fetchProfile()">Search</button>
    </div>

    <div id="status" class="status"></div>

    <div id="profile" class="profile-box">
      <div class="row"><span class="label">Name:</span><span id="name" class="val">-</span></div>
      <div class="row"><span class="label">UID:</span><span id="uid" class="val">-</span></div>
      <div class="row"><span class="label">Level:</span><span id="level" class="val">-</span></div>
      <div class="row"><span class="label">Likes:</span><span id="likes" class="val">-</span></div>
      <div class="row"><span class="label">Region:</span><span id="region" class="val">-</span></div>
      <div class="row"><span class="label">Signature/Bio:</span><span id="bio" class="val">-</span></div>
    </div>
  </div>

  <script>
    async function fetchProfile() {
      const uid = document.getElementById('uidInput').value.trim();
      const status = document.getElementById('status');
      const profile = document.getElementById('profile');

      if (!uid) {
        status.innerText = "कृपया UID दर्ज करें!";
        profile.style.display = "none";
        return;
      }

      status.style.color = "#ff9900";
      status.innerText = "डेटा लोड हो रहा है...";
      profile.style.display = "none";

      try {
        const response = await fetch(`https://free-ff-api-src-55pk.onrender.com/api/v1/account?region=IND&uid=${uid}`);
        
        if (!response.ok) throw new Error("डेटा नहीं मिला या सर्वर व्यस्त है");
        
        const data = await response.json();
        const accInfo = data.AccountInfo || data;

        document.getElementById('name').innerText = accInfo.AccountName || accInfo.nickname || "N/A";
        document.getElementById('uid').innerText = accInfo.AccountId || uid;
        document.getElementById('level').innerText = accInfo.AccountLevel || accInfo.level || "N/A";
        document.getElementById('likes').innerText = accInfo.AccountLikes || accInfo.likes || "0";
        document.getElementById('region').innerText = accInfo.AccountRegion || "IND";
        document.getElementById('bio').innerText = accInfo.AccountSignature || accInfo.bio || "None";

        status.innerText = "";
        profile.style.display = "block";
      } catch (err) {
        status.style.color = "#ff4757";
        status.innerText = "प्लेयर नहीं मिला या API ऑफलाइन है। कृपया दोबारा चेक करें।";
      }
    }
  </script>
</body>
</html>
